  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OKR Platform</title>
  <script>
    // GitHub Pages SPA redirect fix
    // Save the full path including hash and search params
    var pathToSave = location.pathname + location.search + location.hash;
    sessionStorage.setItem('redirect', pathToSave);
    
    // Redirect to base URL
    location.replace('/OKR-Management/');
  </script>
</head>

</body>
