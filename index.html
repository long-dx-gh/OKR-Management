<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OKR Platform - Quản lý Mục tiêu và Kết quả chính</title>
    
    <!-- GitHub Pages SPA redirect fix -->
    <script>
      (function() {
        var redirect = sessionStorage.getItem('redirect');
        sessionStorage.removeItem('redirect');
        if (redirect && redirect !== location.pathname) {
          // Ensure we're using the correct base path
          var basePath = '/OKR-Management';
          var fullPath = redirect.startsWith(basePath) ? redirect : basePath + redirect;
          history.replaceState(null, null, fullPath);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
